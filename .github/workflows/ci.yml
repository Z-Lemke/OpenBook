name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # I02 adds a workspace without changing the root lockfile. Keep the lockfile
      # untouched while installing declared workspace dependencies for CI.
      - run: npm install --package-lock=false --ignore-scripts
      - run: npm run typecheck
      - run: npm test
